[project]
name = "amkit"
version = "0.1.0"
description = "App Owner Toolkit: ticket, cost/license/vendor and report automation over local exports"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-calamine>=0.2",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "python-pptx>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faker>=25.0",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
connectors = ["httpx>=0.27", "truststore>=0.9", "msal>=1.28"]

[project.scripts]
amkit = "amkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (perf, soak); run per milestone",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["web"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true   # only PLW1514 (open() without encoding) comes from preview
select = ["E", "F", "W", "I", "B", "UP", "PLW1514", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
