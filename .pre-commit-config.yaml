# Local hooks only: no Go toolchain, Docker or GitHub fetches (works behind a corporate proxy).
# Install once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: guard-confidential
        name: guard confidential material
        entry: uv run --no-sync python scripts/guard_confidential.py
        language: system
        types: [file]
      - id: detect-secrets
        name: detect-secrets
        entry: uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^(uv\.lock|web/package-lock\.json|\.secrets\.baseline)$
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types_or: [python]
