# Weekly SAP operations review. Facts/tables come from the frozen snapshot (sed.modules.sap.reports.weekly); module: sap.
report: sap-weekly
title: Weekly SAP Operations Review
audience: SAP L3 team lead and application owner
kpis:
  - {fact: sap.l3.opened, compare: sap.l3.opened.avg4w, delta: sap.l3.opened.delta_vs_avg4w_pct}
  - {fact: sap.l3.resolved, compare: sap.l3.resolved.avg4w}
  - {fact: sap.l3.backlog, delta: sap.l3.backlog.delta}
  - {fact: sap.l3.aged_30d}
  - {fact: sap.l3.sla.pct, compare: sap.l3.sla.pct.avg4w, delta: sap.l3.sla.delta_pp_vs_4w}
  - {fact: sap.l3.mttr.median_h, compare: sap.l3.mttr.median_h.avg4w}
  - {fact: sap.l3.p1p2.opened}
  - {fact: sap.l3.attention.count}
  - {fact: sap.findings.count}
  - {fact: sap.changes.open}
  - {fact: sap.changes.urgent_ratio_8w, compare: sap.changes.urgent_ratio_previous_8w, delta: sap.changes.urgent_ratio_delta_pp}
  - {fact: sap.changes.stuck}
  - {fact: sap.changes.prod_imports}
  - {fact: sap.transports.failed_4w}
  - {fact: sap.transports.waiting}
  - {fact: sap.changes.without_jira}
  - {fact: sap.idocs.errors_open}
  - {fact: sap.idocs.errors_aged}
  - {fact: sap.idocs.new_persistent, compare: sap.idocs.new_persistent.avg4w}
  - {fact: sap.idocs.reprocess_median_h}
sheets:
  - table: sap_l3_trend_12w
    sheet: Volume trend
    chart: {type: column, categories: period, series: [opened, resolved], title: SAP incidents opened vs resolved}
  - table: sap_areas
    sheet: Areas
    conditional:
      - {column: sla_pct, rule: "<", value: 90, style: bad}
      - {column: aged_30d, rule: ">=", value: 10, style: warn}
  - {table: sap_backlog_aging_by_area, sheet: Backlog aging}
  - {table: sap_landscapes, sheet: Landscapes}
  - {table: sap_flow_8w, sheet: Area flow}
  - table: sap_sla_by_priority
    sheet: SLA
    conditional: [{column: pct, rule: "<", value: 90, style: bad}]
  - {table: sap_attention, sheet: Needs attention}
  - {table: sap_findings, sheet: Risks}
  - {table: sap_change_stages, sheet: Change stages}
  - table: sap_urgent_by_area
    sheet: Urgent changes
    conditional: [{column: delta_pp, rule: ">=", value: 15, style: bad}]
  - table: sap_prod_imports_12w
    sheet: Production imports
    chart: {type: column, categories: period, series: [imports, failed], title: Production imports per week}
  - {table: sap_transports_failed, sheet: Failed imports}
  - {table: sap_incidents_after_imports, sheet: Incidents after imports}
  - {table: sap_changes_stuck, sheet: Stuck changes}
  - {table: sap_transports_waiting, sheet: Waiting for production}
  - {table: sap_changes_without_jira, sheet: Changes without Jira}
  - {table: sap_idoc_by_type, sheet: IDoc errors}
  - {table: sap_idoc_partners, sheet: IDoc partners}
  - table: sap_idoc_weekly_12w
    sheet: IDoc trend
    chart: {type: column, categories: period, series: [new_errors, persistent], title: IDoc errors per week}
  - {table: sap_idoc_texts, sheet: IDoc error texts}
  - {table: sap_idoc_spikes, sheet: IDoc spikes}
markdown:
  max_words: 250
slides:
  - kind: title
    subtitle: "Week {period}"
  - kind: kpis
    title: SAP L3 support vs 4-week average
    kpis:
      - {fact: sap.l3.opened, compare: sap.l3.opened.avg4w, delta: sap.l3.opened.delta_vs_avg4w_pct}
      - {fact: sap.l3.resolved, compare: sap.l3.resolved.avg4w}
      - {fact: sap.l3.backlog, delta: sap.l3.backlog.delta}
      - {fact: sap.l3.aged_30d}
      - {fact: sap.l3.sla.pct, compare: sap.l3.sla.pct.avg4w, delta: sap.l3.sla.delta_pp_vs_4w}
      - {fact: sap.l3.mttr.median_h, compare: sap.l3.mttr.median_h.avg4w}
    notes: "{{f:sap.scope.note}}. SLA source: {{f:sap.l3.sla.source}}."
  - kind: line_chart
    title: SAP incidents, last 12 weeks
    table: sap_l3_trend_12w
    chart: {type: line, categories: period, series: [opened, resolved], title: SAP incidents opened vs resolved}
  - kind: table
    title: SAP areas this week
    table: sap_areas
  - kind: stacked_bar
    title: SAP backlog aging by area
    table: sap_backlog_aging_by_area
    chart: {type: bar, categories: label, series: [d0_7, d8_30, d31_90, d90p], title: Open SAP incidents by age}
  - kind: bar_chart
    title: Open SAP incidents by landscape
    table: sap_landscapes
    chart: {type: column, categories: label, series: [open], title: Open incidents}
  - kind: attention_list
    title: SAP tickets needing attention
    table: sap_attention
    columns: [number, priority, area_label, app, age_days, reasons]
  - kind: kpis
    title: SAP changes and transports
    kpis:
      - {fact: sap.changes.open}
      - {fact: sap.changes.urgent_ratio_8w, compare: sap.changes.urgent_ratio_previous_8w, delta: sap.changes.urgent_ratio_delta_pp}
      - {fact: sap.changes.stuck}
      - {fact: sap.changes.prod_imports}
      - {fact: sap.transports.failed_4w}
      - {fact: sap.transports.waiting}
  - kind: bar_chart
    title: Production imports, last 12 weeks
    table: sap_prod_imports_12w
    chart: {type: column, categories: period, series: [imports, failed], title: Production imports}
  - kind: table
    title: Failed transport imports
    table: sap_transports_failed
    columns: [transport, system_id, return_code, imported_at, change_id]
  - kind: table
    title: SAP incidents after production imports
    table: sap_incidents_after_imports
    columns: [change_id, system_id, imported_at, return_code, incidents, incidents_before, lift]
  - kind: table
    title: Urgent share of new changes by area
    table: sap_urgent_by_area
    columns: [label, created, urgent, ratio_pct, previous_ratio_pct, delta_pp]
  - kind: table
    title: Stuck changes
    table: sap_changes_stuck
    columns: [change_id, area_label, status, days_in_status, threshold_days]
  - kind: table
    title: Transports waiting for production
    table: sap_transports_waiting
    columns: [transport, change_id, landscape, qa_system, days_waiting]
  - kind: kpis
    title: SAP IDoc health
    kpis:
      - {fact: sap.idocs.errors_open}
      - {fact: sap.idocs.errors_aged}
      - {fact: sap.idocs.new_persistent, compare: sap.idocs.new_persistent.avg4w}
      - {fact: sap.idocs.reprocess_median_h}
      - {fact: sap.idocs.reprocessed_in_grace_pct}
  - kind: bar_chart
    title: IDoc errors, last 12 weeks
    table: sap_idoc_weekly_12w
    chart: {type: column, categories: period, series: [new_errors, persistent], title: New and persistent IDoc errors}
  - kind: table
    title: IDocs in error by system and message type
    table: sap_idoc_by_type
    columns: [system_id, message_type, direction, errors, aged, partners]
  - kind: table
    title: IDoc error spikes after production imports
    table: sap_idoc_spikes
    columns: [change_id, system_id, imported_at, errors, errors_before, lift]
  - kind: findings
    title: System-detected SAP risks
    table: sap_findings
    columns: [severity, title, kind, subject_id]
  - kind: provenance
    title: Provenance
