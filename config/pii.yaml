# PII handling defaults. Real-organisation patterns (e.g. employee-ID format) go in DATA_DIR\config\pii.yaml.
version: 1
pseudonym_prefix: "P-"
pseudonym_hex_chars: 10
truncate:
  short_description: 160
  description: 1500
  close_notes: 1000
  comments: 1000
  summary: 300
  body: 4000
regex:
  email: '[\w.%+\-]+@[\w\-]+(?:\.[\w\-]+)*\.[A-Za-z]{2,}'
  phone: '(?<!\w)(?:\+?\d[\d\s().\-]{7,}\d)(?!\w)'
  ipv4: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
  token_url: 'https?://\S*(?:token|sig|key|password|code)=\S+'
  employee_id: null           # e.g. '\b[A-Z]{3}\d{6}\b' in the local override
signature_markers: [Regards, "Best regards", Best, Thanks, Cordialement, Merci, "Bien à vous", Salutations]
signature_max_lines: 6
replacements:
  email: "[email]"
  phone: "[phone]"
  ipv4: "[ip]"
  token_url: "[url]"
  employee_id: "[employee-id]"
  name: "[person]"
