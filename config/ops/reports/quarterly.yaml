# Quarterly Budget & Governance for IT leadership (plan A10). Facts/tables come from the frozen snapshot built by
# sed.modules.ops.reports.quarterly; module: ops. Cost covers the complete months of the quarter up to the data date.
report: quarterly
title: Quarterly Budget & Governance
audience: IT leadership
kpis:
  - {fact: cost.actual.qtd, compare: cost.budget.qtd, delta: cost.variance.qtd_pct}
  - {fact: cost.actual.ytd, compare: cost.budget.ytd}
  - {fact: cost.variance.qtd_pct}
  - {fact: license.idle_cost}
  - {fact: renewals.2q.count}
  - {fact: notice.2q.count}
  - {fact: apps.quiet.count}
sheets:
  - table: spend_by_category
    sheet: Spend by category
    chart: {type: column, categories: key, series: [actual_qtd, budget_qtd], title: Actual vs budget by category (QTD)}
    conditional: [{column: variance_pct, rule: ">=", value: 25, style: bad}]
  - table: spend_by_app
    sheet: Spend by app
    conditional:
      - {column: variance_pct, rule: ">=", value: 25, style: bad}
      - {column: qoq_pct, rule: ">=", value: 25, style: warn}
  - table: license_idle
    sheet: Idle licenses
    conditional: [{column: utilization, rule: "<", value: 0.7, style: warn}]
  - table: renewals_2q
    sheet: Renewals next 2Q
    conditional: [{column: days_to_notice, rule: "<=", value: 30, style: bad}]
  - {table: risks, sheet: Risks}
  - table: portfolio_health
    sheet: Portfolio health
    conditional: [{column: quiet_apps, rule: ">=", value: 1, style: warn}]
  - {table: quiet_apps, sheet: Quiet apps}
slides:
  - {kind: title, title: Quarterly Budget & Governance, subtitle: IT leadership}
  - {kind: narrative, title: Executive summary, ai_section_key: exec_summary, notes: "AI-drafted, human-approved section."}
  - kind: kpis
    title: Budget and governance summary
    kpis:
      - {fact: cost.actual.qtd, compare: cost.budget.qtd, delta: cost.variance.qtd_pct}
      - {fact: cost.actual.ytd, compare: cost.budget.ytd}
      - {fact: license.idle_cost}
      - {fact: renewals.2q.count}
      - {fact: notice.2q.count}
      - {fact: apps.quiet.count}
  - {kind: section, title: Spend vs budget}
  - {kind: narrative, title: Spend vs budget, ai_section_key: spend_vs_budget, notes: "AI-drafted, human-approved section."}
  - kind: bar_chart
    title: Actual vs budget by cost category
    table: spend_by_category
    chart: {type: column, categories: key, series: [actual_qtd, budget_qtd], title: Quarter to date}
  - kind: table
    title: Spend by application
    table: spend_by_app
    columns: [key, actual_qtd, budget_qtd, variance_pct, qoq_pct, actual_ytd]
    max_rows: 12
  - {kind: section, title: Licenses and renewals}
  - {kind: narrative, title: License optimisation, ai_section_key: license_optimization, notes: "AI-drafted, human-approved section."}
  - {kind: narrative, title: Renewals and vendor risk, ai_section_key: renewals_and_vendor_risk, notes: "AI-drafted, human-approved section."}
  - kind: table
    title: Idle license cost and right-size opportunities
    table: license_idle
    columns: [app, product, entitled_qty, active_qty_90d, utilization, idle_cost_base]
    when: has_rows
  - kind: table
    title: Renewals in the next 2 quarters
    table: renewals_2q
    columns: [contract_number, vendor, end_date, notice_deadline, days_to_notice, auto_renew, annual_value_base]
    when: has_rows
  - kind: findings
    title: Vendor, renewal and license risks
    table: risks
    columns: [severity, title, exposure_eur]
    max_rows: 8
    when: has_rows
  - {kind: section, title: Portfolio health}
  - {kind: narrative, title: Portfolio health, ai_section_key: portfolio_health, notes: "AI-drafted, human-approved section."}
  - kind: table
    title: Criticality x life cycle
    table: portfolio_health
    columns: [criticality, lifecycle, apps, incidents, license_cost, spend, quiet_apps]
  - kind: table
    title: Quiet applications
    table: quiet_apps
    columns: [name, business_criticality, life_cycle_stage, last_ticket, license_cost]
    when: has_rows
  - kind: narrative
    title: Decisions needed
    ai_section_key: decisions_needed
    notes: "AI-drafted, human-approved section."
  - {kind: provenance, title: Provenance}
markdown:
  max_words: 400
sections:
  - key: exec_summary
    title: Executive summary
    summary: true
    max_words: 150
    guide: >-
      Four or five sentences for IT leadership: spend against budget, the largest savings opportunity, the renewal
      decisions due and the portfolio risk that matters most. Written last, from the other sections.
  - key: spend_vs_budget
    title: Spend vs budget
    max_words: 120
    guide: >-
      Quarter-to-date and year-to-date spend against budget, the categories and applications driving the variance,
      and whether the trend needs action.
  - key: license_optimization
    title: License optimisation
    max_words: 100
    guide: >-
      Idle license cost, the largest under-used licenses and the right-sizing opportunity, and over-assigned licenses
      that need a true-up.
  - key: renewals_and_vendor_risk
    title: Renewals and vendor risk
    max_words: 120
    guide: >-
      Renewals and notice deadlines in the next two quarters and the vendor, renewal and license risks, citing the
      approved AI risk findings of the packet where they apply.
  - key: portfolio_health
    title: Portfolio health
    max_words: 100
    guide: >-
      Criticality against life cycle, quiet applications with cost, and candidates for rationalisation.
  - key: decisions_needed
    title: Decisions needed
    max_words: 120
    guide: >-
      The decisions leadership must take this quarter, each with its deadline and the fact behind it.
