# Weekly application operations review. Facts/tables come from the frozen snapshot (sed.reports.snapshot.weekly); module: ops.
report: weekly
title: Weekly Application Operations Review
audience: Support leads and ops review
kpis:
  - {fact: inc.opened, compare: inc.opened.avg4w, delta: inc.opened.delta_vs_avg4w_pct}
  - {fact: inc.resolved, compare: inc.resolved.avg4w}
  - {fact: inc.backlog, delta: inc.backlog.delta}
  - {fact: inc.backlog.stale_excluded}
  - {fact: inc.sla.pct, compare: inc.sla.pct.avg4w, delta: inc.sla.delta_pp_vs_4w}
  - {fact: inc.mttr.median_h, compare: inc.mttr.median_h.avg4w, delta: inc.mttr.delta_vs_avg4w_pct}
  - {fact: inc.p1p2.opened}
  - {fact: attention.count}
  - {fact: inc.stale_open}
  - {fact: chg.success.pct}
  - {fact: renewals.90d.count}
  - {fact: notice.30d.count}
  - {fact: license.idle_cost}
  - {fact: findings.system_detected.count}
sheets:
  - table: volume_trend_12w
    sheet: Volume trend
    chart: {type: column, categories: period, series: [opened, resolved], title: Incidents opened vs resolved}
  - table: sla_by_priority
    sheet: SLA
    conditional: [{column: pct, rule: "<", value: 90, style: bad}]
  - {table: attention, sheet: Needs attention}
  - {table: backlog_aging_by_group, sheet: Backlog aging}
  - {table: top_apps, sheet: Top apps}
  - {table: p1p2, sheet: P1-P2}
  - {table: changes_failed, sheet: Changes}
  - {table: category_breakdown, sheet: Categories}
  - table: renewals_90d
    sheet: Renewals
    conditional: [{column: days_to_notice, rule: "<=", value: 30, style: bad}]
  - table: license_outliers
    sheet: Licenses
    conditional: [{column: utilization, rule: "<", value: 0.7, style: warn}]
  - table: cost_variance
    sheet: Cost vs budget
    conditional: [{column: variance_pct, rule: ">=", value: 25, style: bad}]
  - {table: findings, sheet: Risks}
  - {table: ai_findings, sheet: AI findings}
markdown:
  max_words: 250
slides:
  - kind: title
    subtitle: "Week {period}"
  - {kind: narrative, title: Headline, ai_section_key: headline, notes: "AI-drafted, human-approved section."}
  - kind: kpis
    title: Service KPIs vs 4-week average
    kpis:
      - {fact: inc.opened, compare: inc.opened.avg4w, delta: inc.opened.delta_vs_avg4w_pct}
      - {fact: inc.resolved, compare: inc.resolved.avg4w}
      - {fact: inc.backlog, delta: inc.backlog.delta}
      - {fact: inc.sla.pct, compare: inc.sla.pct.avg4w, delta: inc.sla.delta_pp_vs_4w}
      - {fact: inc.mttr.median_h, compare: inc.mttr.median_h.avg4w, delta: inc.mttr.delta_vs_avg4w_pct}
      - {fact: inc.p1p2.opened}
    notes: "SLA source: {{f:inc.sla.source}}. Backlog excludes stale open incidents ({{f:inc.backlog.stale_excluded}})."
  - {kind: narrative, title: Highlights, ai_section_key: highlights, notes: "AI-drafted, human-approved section."}
  - {kind: narrative, title: Lowlights, ai_section_key: lowlights, notes: "AI-drafted, human-approved section."}
  - kind: kpis
    title: Attention, changes and commercial indicators
    kpis:
      - {fact: attention.count}
      - {fact: inc.stale_open}
      - {fact: inc.backlog.stale_excluded}
      - {fact: chg.success.pct}
      - {fact: renewals.90d.count}
      - {fact: notice.30d.count}
      - {fact: license.idle_cost}
      - {fact: findings.system_detected.count}
  - kind: line_chart
    title: Incident volume, last 12 weeks
    table: volume_trend_12w
    chart: {type: line, categories: period, series: [opened, resolved], title: Incidents opened vs resolved}
  - kind: bar_chart
    title: SLA by priority (resolved this week)
    table: sla_by_priority
    chart: {type: column, categories: priority, series: [pct], title: SLA met %}
    notes: "SLA source: {{f:inc.sla.source}}."
  - kind: stacked_bar
    title: Backlog aging by assignment group
    table: backlog_aging_by_group
    chart: {type: bar, categories: group, series: [0-7d, 8-30d, 31-90d, ">90d"], title: Open incidents by age}
  - kind: attention_list
    title: Needs attention
    table: attention
    columns: [number, priority, app, assignment_group, age_days, reasons]
  - kind: table
    title: Top applications by incidents opened
    table: top_apps
  - kind: table
    title: P1/P2 incidents opened this week
    table: p1p2
    columns: [number, priority, app, state, opened_at, short_description]
  - kind: table
    title: Changes closed with issues or unsuccessful
    table: changes_failed
    columns: [number, app, change_type, close_code, closed_at, short_description]
    when: has_rows
  - kind: table
    title: ServiceNow category vs AI app-owner category
    table: category_breakdown
  - kind: section
    title: Commercial watchlist
    subtitle: Notice deadlines and renewals, license utilization outliers, cost vs budget
  - kind: table
    title: Renewals and notice deadlines (next 90 days)
    table: renewals_90d
    columns: [contract_number, vendor, app, end_date, notice_deadline, days_to_notice, auto_renew, annual_value_base]
  - kind: table
    title: License utilization outliers
    table: license_outliers
    columns: [license_id, app, product, entitled_qty, active_qty_90d, utilization, idle_cost_base]
  - kind: table
    title: Cost vs budget variance
    table: cost_variance
  - kind: findings
    title: System-detected risks
    table: findings
    columns: [severity, title, kind, subject_id]
  - {kind: narrative, title: Recurring issues, ai_section_key: recurring_issues, notes: "AI-drafted, human-approved section."}
  - kind: findings
    title: AI-assisted findings (approved)
    table: ai_findings
    columns: [severity, title, kind, subject_id, recommendation, reviewed_by]
    when: has_rows
  - {kind: narrative, title: Actions for next week, ai_section_key: actions, notes: "AI-drafted, human-approved section."}
  - kind: provenance
    title: Provenance
sections:
  - key: headline
    title: Headline
    summary: true
    max_words: 40
    guide: >-
      One or two sentences on the most important thing about this week's service, with the fact that shows it.
      Written last, from the other sections.
  - key: highlights
    title: Highlights
    max_words: 80
    guide: >-
      Two or three bullets on what went well: SLA or resolution time better than the 4-week average, backlog down,
      problems or clusters closed. Each bullet cites its fact.
  - key: lowlights
    title: Lowlights
    max_words: 80
    guide: >-
      Two or three bullets on what went badly: SLA misses, backlog growth, P1/P2 incidents, failed changes, tickets
      needing attention. Each bullet cites its fact.
  - key: recurring_issues
    title: Recurring issues
    max_words: 120
    guide: >-
      The recurring issues and risks from the AI findings of the packet (cite their finding ids), what they cost in
      tickets and what is being done. Say plainly when there are none.
  - key: actions
    title: Actions for next week
    max_words: 100
    guide: >-
      Three to five concrete actions with the role that owns each (support lead, vendor manager, application owner),
      tied to the lowlights, recurring issues or commercial watchlist. No person names.
