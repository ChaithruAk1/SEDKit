# API connectors for `sed pull <connector>` (read-only). Placeholders only: real instance URLs, source filters and
# secret NAMES go in DATA_DIR\config\connectors.yaml (a whole-file override is simplest). Secret VALUES never go in
# any config file: see src/sed/connectors/credentials.py (environment variable, Windows Credential Manager, or
# DATA_DIR\secret\connectors\<name>). Every connector stays disabled until enabled in the profile's override.

defaults:
  page_size: 500          # rows per API call
  max_rows: 50000         # stop a source after this many rows (the watermark resumes from there next time)
  max_pages: 500          # hard stop on API calls per pull
  pause_seconds: 0.5      # between calls, to stay polite with the instance
  overlap_minutes: 60     # re-read this much before the watermark so late updates are not missed
  timeout_seconds: 60

servicenow:
  enabled: false
  base_url: https://instance.example.invalid
  auth: basic
  user: sed_readonly
  credential: servicenow
  sources:
    - key: incident
      table: incident
      file_prefix: incident          # incident_pull_<stamp>.csv matches the servicenow_incident mapping
      filter: ""                     # optional encoded query ANDed with the watermark, e.g. assignment_groupSTARTSWITH...
      source_tz: Europe/Paris        # the time zone the mapping expects (dates are converted from UTC)
      datetime_fields: [opened_at, sys_updated_on, resolved_at, closed_at]
      # snapshot: true             # whole table every pull: required for exports read as snapshots (cmdb_ci_business_app,
                                   # cmdb_rel_ci, sys_user_group, all open incidents); see docs/sources.md
      fields: [number, sys_id, opened_at, sys_updated_on, resolved_at, closed_at, state, priority, impact, urgency,
               category, subcategory, short_description, description, close_code, close_notes, caller_id,
               assigned_to, assignment_group, business_service, cmdb_ci, made_sla, reassignment_count, reopen_count,
               problem_id, caused_by, parent_incident]

jira:
  enabled: false
  base_url: https://jira.example.invalid
  auth: bearer
  credential: jira
  sources:
    - key: issues
      jql: project in (DEMO)
      file_prefix: jira_pull
      story_points_field: null       # e.g. customfield_10016 on the real instance
      sprint_field: null
      source_tz: Europe/Paris

# Microsoft Graph. `sources` are SharePoint lists (the whole list each pull, with a column map); `libraries` are
# document library folders whose matching files are downloaded as they are (plan exports, RAID logs, workbooks).
sharepoint:
  enabled: false
  base_url: https://graph.example.invalid/v1.0
  auth: bearer
  credential: graph
  sources: []
  libraries: []
  # libraries:
  #   - key: plans
  #     drive_id: <drive id>
  #     folder: Delivery/Plans
  #     patterns: [project_plan_*.xlsx]   # file names the mappings read (docs/sources.md)
  #     download_hosts: [.sharepoint.example]

confluence:
  enabled: false
  base_url: https://confluence.example.invalid
  auth: bearer
  credential: confluence
  sources: []

# SAP Gateway OData (S5). Service paths, entity sets and property names depend on the landscape (Solution Manager
# ChaRM, Cloud ALM, or custom services): confirm them with SAP Basis before enabling. Column keys are the field names
# the sap mappings read; IDoc sources are per production system (own gateway, account and system_id).
sap:
  enabled: false
  base_url: https://solman.example.invalid
  auth: basic
  user: SED_READONLY
  credential: sap-solman
  odata_version: 2
  sources:
    - key: charm_changes
      service_path: /sap/opu/odata/sap/ZSED_CHARM_SRV/ChangeDocuments
      file_prefix: sap_charm_changes
      updated_property: ChangedAt
      datetime_columns: [created_at, changed_at]
      columns: {change_id: ObjectId, transaction_type: ProcessType, title: Description, status: UserStatus,
                priority: Priority, component: Component, cycle: ChangeCycle, created_at: CreatedAt,
                changed_at: ChangedAt, requester: Requester, developer: Developer, change_manager: ChangeManager,
                external_ref: ExternalReference, ticket_ref: IncidentNumber}
    - key: transport_imports
      service_path: /sap/opu/odata/sap/ZSED_CHARM_SRV/TransportImports
      file_prefix: sap_transport_imports
      updated_property: ImportedAt
      datetime_columns: [released_at, imported_at]
      columns: {transport: TransportRequest, system_id: TargetSystem, change_id: ObjectId, transport_type: RequestType,
                description: Description, owner: Owner, released_at: ReleasedAt, import_status: ImportStatus,
                return_code: ReturnCode, imported_at: ImportedAt}
    - key: idocs_prod
      service_path: /sap/opu/odata/sap/ZSED_IDOC_SRV/IdocStatus
      base_url: https://erp-prod.example.invalid
      credential: sap-erp-prod
      file_prefix: sap_idocs
      updated_property: StatusChangedAt
      datetime_columns: [created_at, status_at]
      constants: {system_id: PRD}
      columns: {docnum: Docnum, direction: Direction, message_type: MessageType, basic_type: BasicType,
                partner_type: PartnerType, partner_number: PartnerNumber, status_code: Status, status_text: StatusText,
                created_at: CreatedAt, status_at: StatusChangedAt}
