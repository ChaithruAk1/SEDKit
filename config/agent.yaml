# How Claude Code agents invoke the sed CLI. This is MACHINE-level (it drives the repo-wide CLAUDE.md block
# and the shared settings.local.json): override it in <data root>\agent.yaml on a machine where uv is
# blocked, then run `sed init` to re-render. Use forward slashes: the Bash tool is Git Bash.
command_prefix: uv run sed
fallback_prefix: .venv/Scripts/python -m sed
shell_tool: Bash
